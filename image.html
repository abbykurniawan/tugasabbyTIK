<?DOCTYPE <html>
<html>
    <head>
        <title> Image HTML dan CSS </title>
        <link rel="stylesheet" href="image.css">
    </head>
    <body>
    <center>
        <p> ini adalah gambar ukuran normal</p>
        <!-- Cara menambahkan gambar,format image.jpg/.jpeg/.png/.gif --> 
         <img src="SANUR-JL-BANTENG-1.png" alt="sekolahku">

         <!-- Cara merubah ukuran gambar -->
          <p> Ini adalah gambar yang sudah diganti ukurannya</p>
          <img src="SANUR-JL-BANTENG-1.png" alt="Santa ursula jakarta" class="ukuran">

          <!-- Cara menambahkan lengkungan pada setiap sudut -->
           <p> Ini adalah gambar yang sudah diberikan lengkungan</p>
           <img src="SANUR-JL-BANTENG-1.png" alt="sekolahku"class="lengkungan">

         <!-- cara menambahkan boder pada gambar -->
         <p> ini adalah menambahkan border pada gambar</p>
         <img src="SANUR-JL-BANTENG-1.png" alt="sekolahku"class="border">
         <!-- Cara menggabungkan gambar dan teks -->
         <div class="kelompok" >
            <img src="SANUR-JL-BANTENG-1.png" alt="sekolahku">
            <P> gambar sekolah </P>
        </div>

        <!-- Cara menambahkan efek hover -->
         <div class="efek">
            <img src="SANUR-JL-BANTENG-1.png"alt="sekolah">
            <p> ini contoh hover</P>

        </div>

         </center
    </body> 
</html>
